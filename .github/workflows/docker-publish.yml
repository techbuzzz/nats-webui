name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  # Manual re-run from the Actions tab. Building without pushing is safe;
  # publishing requires a semver tag, so a manual run of main verifies only.
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # No mutable `latest` alias is ever produced. Only a release tag
            # publishes a named image, so an untagged commit can never take over
            # a tag someone is pulling.
            type=raw,value=latest,enable=false
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Self-hosted web UI for the NATS monitoring endpoint, JetStream, and a publish/request playground.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # `push` is gated on the ref actually being a semver tag, NOT on the event
      # being a push. metadata-action emits no tags for an untagged commit, and
      # buildx refuses to push an untagged manifest:
      #   ERROR: failed to build: tag is needed when pushing to registry
      # So `push: ${{ github.event_name != 'pull_request' }}` would break every
      # push to main. Main pushes build for both architectures and verify, then
      # discard — the per-PR image check lives in ci.yml's `compose` job.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations give a verifiable link from the image digest back to
          # the workflow run that produced it.
          provenance: mode=max
          sbom: true