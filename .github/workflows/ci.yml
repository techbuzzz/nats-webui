name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref. A PR's own run is never cancelled, so
# the check a reviewer is waiting on always survives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static checks and unit tests, on every supported Node line.
  # fail-fast: false so one broken Node version does not hide the state of
  # the others — you want all three results at once when diagnosing.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.x is in Maintenance LTS (EOL 2027-04-30); 24.x is Active LTS.
        # Both still ship security fixes, so both are supported runtimes.
        node: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci`, not `npm install`: it installs exactly the lockfile tree and
      # fails loudly when package.json and package-lock.json have drifted.
      - name: Install dependencies
        run: npm ci

      # `postinstall` runs `nuxt prepare`, which generates .nuxt/ — including the
      # ESLint flat config and the tsconfigs that the type-aware rules resolve
      # against. Both lint and typecheck below depend on it having run.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # End-to-end smoke test: build the real image and boot it as a sidecar next to
  # nats-server. The whole value proposition of this project is the deployment,
  # so a PR that breaks the Dockerfile or docker-compose.yml must not be able to
  # go green — unit tests alone cannot catch that.
  # ---------------------------------------------------------------------------
  compose:
    name: Sidecar smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built but not pushed: a PR must never publish an image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: peanuts-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --wait blocks until every service reports healthy, so the curls below
      # cannot race the startup of the WebUI.
      - name: Start the stack
        run: docker compose up -d --wait --timeout 120

      - name: Assert the API answers
        run: |
          set -euo pipefail
          for path in /api/health /api/monitor/varz /api/monitor/connz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://localhost:3000${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "expected 200 from ${path}"; exit 1; }
          done

      # The health endpoint reports NATS reachability separately from its own
      # liveness, so a 200 alone would still pass with NATS unreachable.
      - name: Assert NATS is actually reachable through the proxy
        run: |
          set -euo pipefail
          curl -s --max-time 20 http://localhost:3000/api/health \
            | grep -q '"natsReachable":true' \
            || { echo "proxy reports NATS unreachable"; curl -s http://localhost:3000/api/health; exit 1; }
          curl -s --max-time 20 http://localhost:3000/api/health

      # The monitoring port is deliberately unpublished; this guards the
      # security property that the README claims.
      - name: Assert the monitoring port stays unpublished
        run: |
          set -euo pipefail
          if curl -s --max-time 5 -o /dev/null http://localhost:8222/varz; then
            echo ":8222 is reachable from the runner — it must stay internal"
            exit 1
          fi
          echo "ok: :8222 is not published"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      # Always, including on failure, so a failed run does not leave a runner
      # with orphaned containers or volumes.
      - name: Tear down
        if: always()
        run: docker compose down -v