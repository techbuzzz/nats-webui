name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref; never cancel a PR's base-branch run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`): it installs exactly the lockfile tree and
      # fails loudly if package.json and package-lock.json have drifted.
      - name: Install dependencies
        run: npm ci

      # `postinstall` runs `nuxt prepare`, which generates .nuxt/ including the
      # ESLint flat config and the tsconfigs the type-aware rules resolve against.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build