# NATS server configuration for the Peanuts WebUI sidecar stack.
#
# WebSocket support cannot be enabled with a command-line flag, so the server is
# started with this file. Mount it read-only in docker-compose.yml.

listen: 0.0.0.0:4222
server_name: peanuts-nats

# Monitoring endpoint. Deliberately NOT published to the host: the WebUI's
# Nitro proxy is the only client, so the browser never talks to this port.
http: 0.0.0.0:8222

jetstream {
  store_dir: "/data/jetstream"
}

# WebSocket listener for the browser playground (publish / request-reply).
# `no_tls` is for local development only; use `tls` with certificates in
# anything reachable beyond localhost.
websocket {
  port: 8080
  no_tls: true
}